name: Mobile checks
on:
  push:
    branches: [main, jojo]
  pull_request:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test vendor/mobile/src vendor/core/src
      - run: bunx expo export --platform all --output-dir dist
